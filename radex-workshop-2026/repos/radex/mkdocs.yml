site_name: RADICAL Data Exchanger (radex)
site_url: https://radical-cybertools.github.io/radex
site_author: RADICAL Cybertools
site_description: Data Exchange Layer for RADICAL Cybertools (RCT).

repo_name: radical-cybertools/RaDex
repo_url: https://github.com/radical-cybertools/RaDex

copyright: Copyright &copy; 2024—Present by <a target="_blank" href="https://radical.rutgers.edu">RADICAL Lab</a>

theme:
  name: material
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - header.autohide
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

watch:
  - mkdocs.yml
  - README.md
  - docs/
  - include/
  - src/python/src/radex
  - example/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/radical-cybertools/radex

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: radical-cybertools
      repo: RaDex
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home:
      - Overview: index.md
      - Get Started: getting-started/index.md
      - Installation: getting-started/installation.md
      - Building From Source: getting-started/building-from-source.md
      - Fetching Dragon & SmartRedis: getting-started/fetching-backends.md
      - Quick Start: getting-started/quick-start.md
      - Developer's Guide: getting-started/developer-guide.md
      - Issues (GitHub): https://github.com/radical-cybertools/RaDex/issues
  - Examples:
      - Overview: examples/index.md
      - Active Learning (MPI + Dragon DDict): examples/active-learn.md
      - C++ Data Exchange: examples/cpp-exchange.md
      - Python/C++ Data Exchange: examples/py-cpp-exchange.md
  - API Reference:
      - Overview: api/index.md
      - Python: api/
      - C++: radexCpp/annotated.md
  - About: about.md

plugins:
  - search
  - mkdoxy:
      projects:
        radexCpp:
          src-dirs: include/radex
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.hpp *.h"
            RECURSIVE: True
            PROJECT_NAME: "RaDex C++ API"
            # build_config.hpp leaves these `#undef`-ed unless CMake defines
            # them; since docs are built without running CMake, predefine
            # them so the Dragon/SmartRedis client classes they gate aren't
            # skipped by Doxygen's preprocessor.
            ENABLE_PREPROCESSING: True
            MACRO_EXPANSION: True
            EXPAND_ONLY_PREDEF: True
            PREDEFINED: "RADEX_HAS_DRAGON=1 RADEX_HAS_SMARTREDIS=1"
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      enable_inventory: true
      handlers:
        python:
          options:
            allow_inspection: yes
            annotations_path: brief
            docstring_section_style: list
            docstring_style: google
            filters:
              - "!^_"
            inherited_members: yes
            line_length: 60
            members_order: source
            merge_init_into_class: yes
            separate_signature: yes
            show_if_no_docstring: no
            show_object_full_path: no
            show_root_full_path: yes
            show_root_heading: no
            show_root_members_full_path: no
            show_root_toc_entry: yes
            show_signature_annotations: yes
            show_submodules: no
            show_symbol_type_heading: yes
            show_symbol_type_toc: yes
            signature_crossrefs: yes
